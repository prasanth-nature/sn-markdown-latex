<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown + LaTeX</title>
  <link rel="stylesheet" href="./app.css?v=__VERSION__">
  <script defer src="./app.js?v=__VERSION__"></script>
</head>
<body data-mode="split">
  <header class="bar">
    <div class="seg" role="group" aria-label="View mode">
      <button type="button" data-mode="edit" aria-pressed="false">Edit</button>
      <button type="button" data-mode="split" aria-pressed="true">Split</button>
      <button type="button" data-mode="view" aria-pressed="false">Preview</button>
    </div>
    <div class="tools" role="toolbar" aria-label="Formatting">
      <button type="button" data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button>
      <button type="button" data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button>
      <button type="button" data-cmd="code" title="Inline code" aria-label="Inline code"><span class="mono">&lt;/&gt;</span></button>
      <button type="button" data-cmd="link" title="Link (Ctrl+K)" aria-label="Link">Link</button>
      <button type="button" data-cmd="list" title="Bulleted list" aria-label="Bulleted list">List</button>
      <button type="button" data-cmd="task" title="Task list" aria-label="Task list">Tasks</button>
      <button type="button" data-cmd="quote" title="Quote" aria-label="Quote">Quote</button>
      <button type="button" data-cmd="math" title="Inline math (Ctrl+Shift+M)" aria-label="Inline math"><span class="mono">$x$</span></button>
      <button type="button" data-cmd="display" title="Display math block" aria-label="Display math block"><span class="mono">$$</span></button>
    </div>
    <span id="count" class="count"></span>
  </header>
  <div id="notice" class="notice" role="status"></div>
  <main id="panes" data-mode="split">
    <textarea id="src" spellcheck="false" aria-label="Markdown source"></textarea>
    <article id="out" tabindex="0" aria-label="Rendered preview"></article>
  </main>
</body>
</html>
